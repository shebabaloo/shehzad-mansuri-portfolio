name: Deploy to GitHub Pages

# Pages serves static files; it does not run Vite. This builds the site on every push to
# main and publishes dist/ as the deployed artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write a Pages deployment, and use OIDC to prove identity.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs are cancelled rather than queued, so the
# newest push always wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # SITE_URL is what index.html's %SITE_URL% placeholders resolve to, and it is the
      # difference between working link previews and Open Graph tags pointing at
      # localhost. Set it as a repository variable (Settings > Secrets and variables >
      # Actions > Variables) to the live domain, e.g. https://shehzadmansuri.com — no
      # trailing slash. The build warns and falls back if it is missing.
      # BASE_PATH is where the site is served from. On the free github.io URL that is
      # /<repo>/, and leaving it unset ships a blank page: the asset URLs are baked in at
      # build time and would all point at the domain root. Set the repository variable
      # BASE_PATH to /shehzad-mansuri-portfolio/ until a custom domain serves from the
      # root, then delete it.
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}

      # The gate. This site is almost entirely canvas work driven by scroll, and an
      # exception inside a requestAnimationFrame loop is silent — the loop survives, because
      # the next frame was already scheduled, and the canvas simply holds its last good
      # frame. That is how the starfield once shipped frozen through its whole
      # night-to-paper transition: a screenshot at rest looked perfect.
      #
      # So the smoke test asserts what a screenshot cannot — that nothing throws, and that
      # the animation actually changes while the page is moving. Verified against the real
      # defect: reintroducing it fails five checks and exits non-zero.
      #
      # It runs on the built site, and before upload, so a broken build is never published.
      - run: npx playwright install chromium --only-shell --with-deps
      # BASE_PATH must match the build's. The artifact has the prefix baked into every asset
      # URL, so a smoke server that does not strip it serves 404s and the app never mounts.
      - run: node scripts/smoke.mjs
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
