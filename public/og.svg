<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30231c"/>
      <stop offset="0.55" stop-color="#1c1410"/>
      <stop offset="1" stop-color="#16100d"/>
    </linearGradient>
    <radialGradient id="lift" cx="0.32" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#3a2a20" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3a2a20" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#field)"/>
  <rect width="1200" height="630" fill="url(#lift)"/>

  <!-- The staff: same five-line rail the site resolves into out of the spiral. -->
  <g stroke="#bc9769" stroke-opacity="0.34" stroke-width="1">
    <line x1="0" y1="286" x2="1200" y2="286"/>
    <line x1="0" y1="306" x2="1200" y2="306"/>
    <line x1="0" y1="326" x2="1200" y2="326"/>
    <line x1="0" y1="346" x2="1200" y2="346"/>
    <line x1="0" y1="366" x2="1200" y2="366"/>
  </g>

  <!-- Note heads scattering off the right edge, the same gesture as the coda. -->
  <g fill="#f35e3d">
    <ellipse cx="905" cy="326" rx="11" ry="8" transform="rotate(-22 905 326)" opacity="0.9"/>
    <ellipse cx="962" cy="296" rx="10" ry="7.5" transform="rotate(-22 962 296)" opacity="0.72"/>
    <ellipse cx="1014" cy="352" rx="9" ry="7" transform="rotate(-22 1014 352)" opacity="0.55"/>
    <ellipse cx="1069" cy="274" rx="8" ry="6" transform="rotate(-22 1069 274)" opacity="0.4"/>
    <ellipse cx="1108" cy="368" rx="7" ry="5.5" transform="rotate(-22 1108 368)" opacity="0.28"/>
    <ellipse cx="1152" cy="312" rx="6" ry="4.5" transform="rotate(-22 1152 312)" opacity="0.18"/>
  </g>

  <text x="84" y="132" fill="#bc9769" font-family="Menlo"
        font-size="20" letter-spacing="5.4">PRELUDE &#183; A PERSONAL INDEX</text>

  <g font-family="Bodoni 72">
    <text x="78" y="300" fill="#f9f1e2" font-size="132">The Living</text>
    <text x="78" y="424" fill="#f35e3d" font-size="132">Score</text>
  </g>

  <text x="84" y="516" fill="#f9f1e2" font-family="Menlo"
        font-size="26" letter-spacing="3.6">SHEHZAD MANSURI</text>
  <text x="84" y="558" fill="#ccc3b5" font-family="Avenir Next"
        font-size="23">Product thinking &#183; Systems building &#183; Curious by default</text>

  <!-- Treble clef, the site's mark. -->
  <text x="1044" y="150" fill="#f35e3d" font-family="Apple Symbols"
        font-size="112" opacity="0.5">&#119070;</text>
</svg>
